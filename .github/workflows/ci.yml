name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grammar:
    name: Grammar and Neovim tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out tree-sitter-bg3
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked Node.js dependencies
        run: npm ci

      - name: Add the Tree-sitter CLI to PATH
        run: echo "${{ github.workspace }}/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Check out plenary.nvim
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout v4.2.2
        with:
          repository: nvim-lua/plenary.nvim
          ref: 74b06c6c75e4eeb3108ec01852001636d85a932b # plenary.nvim master 2026-04-10
          path: .ci/plenary.nvim
          fetch-depth: 1

      - name: Check out XML tree-sitter parser
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout v4.2.2
        with:
          repository: tree-sitter-grammars/tree-sitter-xml
          ref: 5000ae8f22d11fbe93939b05c1e37cf21117162d # tree-sitter-xml 0.7.0
          path: .ci/tree-sitter-xml
          fetch-depth: 1

      - name: Install pinned Neovim
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nvim.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-linux-x86_64.tar.gz \
            --output "$archive"
          echo "bce0f56eda1f1b1db6eee8f4133d7a38813ea07933837dd1777411ca384c6875  $archive" \
            | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Build XML parser
        run: |
          mkdir -p build/parser
          tree-sitter build --output build/parser/xml.so .ci/tree-sitter-xml/xml

      - name: Run grammar and Neovim tests
        env:
          PLENARY_PATH: ${{ github.workspace }}/.ci/plenary.nvim
        run: make test

      - name: Check generated parser artifacts
        run: git diff --exit-code -- .

      - name: Check npm package layout
        run: npm pack --dry-run

      - name: Check release workflow invariants
        run: ./test/release-workflow.sh

  rust:
    name: Rust checks and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out tree-sitter-bg3
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action 2026-08-27
        with:
          components: clippy,rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run Rust tests
        run: cargo test --workspace --locked

      - name: Run Rust lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Check Cargo package layout
        run: cargo package --allow-dirty --locked
